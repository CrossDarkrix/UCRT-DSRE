# CD の取り込みの変換に使う FFmpeg(tools/ffmpeg/build.sh)をビルドし、リリースに置く。
# 手動で実行する(Actions → FFmpeg → Run workflow)。アプリのビルドは app/build.gradle.kts の fetchFfmpeg が取ってくる
name: FFmpeg

on:
  workflow_dispatch:
    inputs:
      release:
        description: "リリースの名前(空ならビルドだけして、成果物として置く)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" tools/ffmpeg/build.sh out
          cd out && zip -qr ../ucrt-ffmpeg.zip . && cd ..
          sha256sum ucrt-ffmpeg.zip | tee ucrt-ffmpeg.zip.sha256
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - uses: actions/upload-artifact@v4
        with:
          name: ucrt-ffmpeg
          path: |
            ucrt-ffmpeg.zip
            ucrt-ffmpeg.zip.sha256

      - name: Release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release }}" ucrt-ffmpeg.zip ucrt-ffmpeg.zip.sha256 \
            --target "${{ github.sha }}" --title "${{ inputs.release }}" --prerelease \
            --notes "CD の取り込みの変換(FLAC・MP3)に使う FFmpeg(アプリのビルドが自動で取得します。単体で入れるものではありません)。tools/ffmpeg/build.sh でビルド。FFmpeg・LAME とも GNU LGPL。SHA-256: $(cut -d' ' -f1 ucrt-ffmpeg.zip.sha256)"
